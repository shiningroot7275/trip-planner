<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행 플래너">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f1">
<title>여행 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* 레이아웃: 지도 중심 앱 화면. 휴대폰은 위 제목줄 + 화면 + 아래 탭 막대, 넓은 화면은 왼쪽 지도 + 오른쪽 패널 */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface-2:#f4f7f6; --surface-3:#e2e9e7;
  --ink:#13211e; --ink-2:#4a5c57; --ink-3:#7c8d88; --line:#d4dedb;
  --accent:#0d7457; --accent-ink:#ffffff; --accent-soft:#d6ede4;
  --warn:#a9520e; --warn-soft:#fbead9; --danger:#c42b3a; --danger-soft:#fbe4e6; --ok:#1d7647;
  --route-foot:#0d7457; --route-car:#2e6fb0; --me:#2f7cf6;
  --board-bg:#13201d; --board-ink:#eef5f2; --board-dim:#8fa59f; --board-hi:#ffcf5c;
  --shadow:0 1px 2px rgba(16,32,28,.08),0 8px 24px rgba(16,32,28,.12);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --num:"Barlow Condensed","Pretendard Variable","Arial Narrow",sans-serif;
  --tab-h:58px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1412; --surface:#15201d; --surface-2:#1a2723; --surface-3:#24342f;
    --ink:#e4eeeb; --ink-2:#a3b5b0; --ink-3:#71847f; --line:#2a3a35;
    --accent:#3cba8e; --accent-ink:#05231a; --accent-soft:#163a2f;
    --warn:#f0a35e; --warn-soft:#3a2614; --danger:#ff7482; --danger-soft:#3d1a1f; --ok:#5fcf8f;
    --route-foot:#3cba8e; --route-car:#6ea8ea; --me:#4d93ff;
    --board-bg:#0a1311; --board-ink:#eef5f2; --board-dim:#86a099; --board-hi:#ffcf5c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1412; --surface:#15201d; --surface-2:#1a2723; --surface-3:#24342f;
  --ink:#e4eeeb; --ink-2:#a3b5b0; --ink-3:#71847f; --line:#2a3a35;
  --accent:#3cba8e; --accent-ink:#05231a; --accent-soft:#163a2f;
  --warn:#f0a35e; --warn-soft:#3a2614; --danger:#ff7482; --danger-soft:#3d1a1f; --ok:#5fcf8f;
  --route-foot:#3cba8e; --route-car:#6ea8ea; --me:#4d93ff;
  --board-bg:#0a1311; --board-ink:#eef5f2; --board-dim:#86a099; --board-hi:#ffcf5c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--ink-2)} .small{font-size:13px}
.ic{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:currentColor;stroke:none}

/* 앱 뼈대 */
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main" "tabs"}
.topbar{grid-area:top;display:flex;align-items:center;gap:12px;padding:max(8px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));background:var(--surface);border-bottom:1px solid var(--line);z-index:20}
.tb-main{flex:1;min-width:0}
.topbar h1{font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-meta{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-side{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.dday{font:700 22px var(--num);color:var(--accent);letter-spacing:.02em}
.clock{font:500 13px var(--num);color:var(--ink-2);letter-spacing:.03em}
.view-map{grid-area:main}
.panel{display:contents}
.panel>.view{grid-area:main}
.tabbar{grid-area:tabs;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar button{height:var(--tab-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3)}
.tabbar button .ic{width:23px;height:23px}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.view{position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}
.vhead{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right)) 4px max(16px,env(safe-area-inset-left))}
.vhead h2{flex:1;font-size:20px;font-weight:700}
.vhead h2 i{font:600 18px var(--num);color:var(--ink-3);font-style:normal;margin-left:4px}

/* 버튼·입력 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn.sm{height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.danger.ghost{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn .ic{width:18px;height:18px}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.sm{width:30px;height:30px}
.icon-btn.sm .ic{width:16px;height:16px}
.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fld input,.fld select,.fld textarea,.hrow input,.cl-add input,.linkbox{width:100%;min-width:0;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:16px}
.fld textarea,.linkbox{height:auto;padding:10px 12px;resize:vertical}
.fld input.bad,.hrow input.bad{border-color:var(--danger);background:var(--danger-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:14px;font-weight:600}
.note{padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink)}
.chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* 지도 화면 */
.view-map{position:relative}
#map{position:absolute;inset:0;z-index:0;background:var(--surface-3)}
.leaflet-container{font:inherit;background:var(--surface-3)}
#map.dark-tiles .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--ink-2)}
.leaflet-control-attribution a{color:var(--ink-2)}
.map-top{position:absolute;top:0;left:0;right:0;z-index:5;padding:10px max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.map-top>*{pointer-events:auto}
.search{display:flex;align-items:center;gap:6px;height:46px;padding:0 5px 0 12px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.search .ic{color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;height:100%;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.search-results{max-height:min(52vh,420px);overflow:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);padding:6px}
.sr{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px}
.sr:hover{background:var(--surface-2)}
.sr b{font-size:15px}
.sr small{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sr-sec{font-size:11.5px;font-weight:700;color:var(--ink-3);padding:8px 10px 2px;letter-spacing:.04em}
.sr-msg{padding:12px 10px;color:var(--ink-2);font-size:14px}
.sr-attr{font-size:11px;color:var(--ink-3);padding:4px 10px 2px}
.daychips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.daychips::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-size:13.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.dchip b{font:600 15px var(--num);color:var(--ink)}
.dchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dchip.on b{color:var(--accent-ink)}
.map-ctrl{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:28px;z-index:5;display:flex;flex-direction:column;gap:8px}
.fab{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.fab.on{color:var(--me);border-color:var(--me)}
.fab.zoom{display:none}
.view-map.has-sheet .map-ctrl{display:none}
.crosshair{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:6;pointer-events:none}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:var(--danger);border-radius:2px}
.crosshair::before{left:21px;top:0;width:2px;height:44px}
.crosshair::after{top:21px;left:0;height:2px;width:44px}
.pickbar{position:absolute;left:12px;right:12px;bottom:16px;z-index:7;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.pickbar div{display:flex;gap:8px;justify-content:flex-end}
.map-fail{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2);background:var(--bg)}

/* 지도 표시 */
.pin-wrap{background:none;border:0}
.pin{position:relative;width:34px;height:44px;display:flex;justify-content:center;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));transform-origin:50% 92%;transition:transform .15s}
.pin-head{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:var(--c);border:2.5px solid #fff;display:grid;place-items:center;color:#fff}
.pin::after{content:"";position:absolute;left:50%;top:22px;width:12px;height:12px;background:var(--c);transform:translateX(-50%) rotate(45deg);border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;border-radius:0 0 3px 0}
.pin .ic{width:16px;height:16px;stroke:#fff;stroke-width:2.2}
.pin b{font:700 15px/1 var(--num);color:#fff;letter-spacing:.02em}
.pin.sel{transform:scale(1.22)}
.pin.sel .pin-head{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 40%,transparent)}
.pin.faded{opacity:.32;filter:grayscale(.5)}
.pin.num .pin-head{width:30px}
.me-dot{background:var(--me);border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 3px color-mix(in srgb,var(--me) 35%,transparent)}
path.me-acc{stroke:var(--me);fill:var(--me);fill-opacity:.12;stroke-opacity:.5}
path.rt-foot{stroke:var(--route-foot);stroke-opacity:.9}
path.rt-car{stroke:var(--route-car);stroke-opacity:.85}
path.rt-straight{stroke:var(--ink-2);stroke-opacity:.7}
path.rt-day{stroke:var(--accent);stroke-opacity:.85}

/* 아래에서 올라오는 정보 창 */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;max-height:60%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:4px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.sh-head{display:flex;align-items:flex-start;gap:8px}
.sh-head .t{flex:1;min-width:0}
.sh-head h3{font-size:19px;font-weight:700;line-height:1.3}
.sh-head .loc{font-size:13.5px;color:var(--ink-2)}
.catchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--c);margin-bottom:2px}
.catchip .ic{width:14px;height:14px}
.tag{display:inline-block;font-style:normal;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--surface-3);color:var(--ink-2);margin-left:6px;vertical-align:2px}
.sec{margin-top:12px}
.sec h4{margin:0 0 6px;font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.03em}
.hrs{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 12px;font-size:14px}
.hrs .d{color:var(--ink-2)}
.hrs .v{font-variant-numeric:tabular-nums}
.hrs .trip{font-weight:700;color:var(--ink)}
.hrs .td{font-size:11.5px;font-weight:700;color:var(--accent)}
.hrs .unk{color:var(--ink-3)}
.verify{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:8px;margin-top:8px}
.verify.official{background:var(--accent-soft);color:var(--ok)}
.verify.other{background:var(--surface-3);color:var(--ink-2)}
.verify.none{background:var(--warn-soft);color:var(--warn)}
.verify .ic{width:14px;height:14px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;overflow-wrap:anywhere}
.kv a{color:var(--accent)}
.sh-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.sh-acts .btn{width:100%;height:42px;font-size:14px;padding:0 8px}
.sh-acts .wide{grid-column:1/-1}
.hint{margin-top:12px;font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:flex-start}
.hint .ic{width:16px;height:16px;margin-top:2px;color:var(--accent)}
.rt-ends{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;margin-top:4px}
.rt-ends p{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-ends small{font-weight:500;color:var(--ink-3);font-size:12px;margin-right:6px}
.rt-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rt-row:first-of-type{margin-top:10px}
.rt-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.rt-row.rec .rt-ic{background:var(--accent-soft);color:var(--accent)}
.rt-main b{font:600 22px/1.1 var(--num);letter-spacing:.01em}
.rt-main b small{font:600 13px var(--font);color:var(--ink-2);margin-left:4px}
.rt-main p{font-size:12.5px;color:var(--ink-2)}
.est{color:var(--warn);font-weight:700}
.rt-legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap}
.rt-legend i{display:inline-block;width:18px;height:0;border-top:4px solid var(--route-foot);vertical-align:3px;margin-right:4px}
.rt-legend i.car{border-top:3px dashed var(--route-car)}
</style>
<style>
/* 장소 목록 */
.filters{display:flex;gap:6px;overflow-x:auto;padding:6px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));scrollbar-width:none;flex:0 0 auto}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.fchip i{font:600 14px var(--num);font-style:normal;color:var(--ink-3)}
.fchip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.fchip.on i{color:var(--surface)}
.plist{display:flex;flex-direction:column;gap:8px}
.pcard{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pc-main{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;background:none;padding:12px 4px 12px 12px;min-width:0}
.badge-ic{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff}
.badge-ic .ic{width:18px;height:18px;stroke-width:2.1}
.pc-txt{display:flex;flex-direction:column;min-width:0;gap:1px}
.pc-txt b{font-size:15.5px;font-weight:700}
.pc-txt small{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-hours{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pc-hours .unk{color:var(--warn)}
.pc-days{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.pc-days i{font-style:normal;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.pc-act{display:flex;flex-direction:column;padding-right:6px}
.empty{padding:32px 16px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:12px;align-items:center}

/* 시간표 */
.plan-top{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line)}
.daytabs{display:flex;gap:6px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.dtab{flex:0 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:0;padding:5px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);line-height:1.15}
.dtab small{font-size:11px;font-weight:600}
.dtab b{font:600 19px var(--num);color:var(--ink)}
.dtab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

}

function dndEnd(x, y) {

  if (!tg) return;
  if (A.pl.type === 'place') return openScheduleModal({ placeId: A.pl.pid, date: tg.date, start: fmtHM(tg.start), end: fmtHM(tg.end) });
  const s = T().schedule.find(z => z.id === A.pl.sid); if (!s) return;

function refreshSchedCheck() {
  const box = $('#sf-check'); if (!box) return;
  const o = readSchedForm(), p = placeById(o.placeId), s = toMin(o.start), e = toMin(o.end);
  if (!p || s == null || e == null) { box.innerHTML = ''; return; }
  if (e <= s) { box.innerHTML = `<p class="ck bad">${icon('warn')}종료 시각이 시작 시각보다 늦어야 합니다. 자정을 넘기는 일정은 다음 날로 나눠 넣어 주세요.</p>`; return; }

  else if (hc.state === 'outside') out.push(`<p class="ck warn">${icon('warn')}${wdl} 운영시간(${esc(hc.text)}) 밖입니다.</p>`);
  else if (hc.state === 'closed') out.push(`<p class="ck warn">${icon('warn')}${wdl}은 휴무일입니다.</p>`);
  else out.push(`<p class="ck">${icon('clock')}${wdl} 운영시간 정보가 없습니다.</p>`);
  if (p.hoursNote) out.push(`<p class="ck sub">${esc(p.hoursNote)}</p>`);

  const ov = others.filter(it => it.start < e && it.end > s);
  if (ov.length) out.push(`<p class="ck warn">${icon('warn')}겹치는 일정: ${ov.map(it => `${esc(itemName(it))} ${fmtHM(it.start)}–${fmtHM(it.end)}`).join(', ')}</p>`);
  const prev = others.filter(it => it.end <= s).sort((a, b) => b.end - a.end)[0];
  const next = others.filter(it => it.start >= e).sort((a, b) => a.start - b.start)[0];
  const leg = (a, b, gap, txt) => {
    if (!a || !b || a.id === b.id || dist(a, b) < 40) return;

  };
  if (prev) leg(prev.after, p, s - prev.end, `앞 일정(${esc(itemName(prev))})에서`);

let flightSaveTimer;
function onFlightInput(e) {

function setCheck(id, fn) { const c = T().checklist.find(x => x.id === id); if (c) { fn(c); commit(); } }

/* 공유 링크: 여행 자료 전체를 압축해 주소 뒤(#share=)에 붙인다. 서버로는 아무것도 보내지 않는다 */
function makeShare() {
  if (typeof LZString === 'undefined') return toast('압축 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
  const url = `${location.href.split('#')[0]}#share=${LZString.compressToEncodedURIComponent(JSON.stringify(T()))}`;
  const isFile = location.protocol === 'file:';
  openModal(`${mHead('공유 링크')}<div class="mbody">
    <p class="small muted">이 링크를 연 사람은 지금 일정(장소 ${T().places.length}곳, 일정 ${T().schedule.length}개)을 자기 기기로 가져올 수 있습니다. 링크 길이 ${url.length.toLocaleString()}자.</p>
    ${isFile ? '<p class="note warn">지금은 컴퓨터의 파일로 열려 있어서 이 링크는 다른 기기에서 열리지 않습니다. 파일을 웹 주소로 올린 뒤 그 주소에서 링크를 만들어 주세요. 같은 컴퓨터 안에서는 백업 파일을 쓰세요.</p>' : ''}
    <textarea class="linkbox" id="shareUrl" rows="4" readonly>${esc(url)}</textarea></div>
    <div class="mf"><span class="sp"></span>${navigator.share ? `<button class="btn" id="sh-share">${icon('share')}보내기</button>` : ''}<button class="btn primary" id="sh-copy">${icon('copy')}복사</button></div>`, c => {
    $('#sh-copy', c).onclick = () => {
      const ta = $('#shareUrl');
      const fallback = () => { ta.focus(); ta.select(); try { document.execCommand('copy'); toast('링크를 복사했습니다.'); } catch (e) { toast('링크를 길게 눌러 직접 복사해 주세요.'); } };
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('링크를 복사했습니다.'), fallback); else fallback();
    };
    if (navigator.share) $('#sh-share', c).onclick = () => navigator.share({ title: T().name, url }).catch(() => {});
  });
}
function exportBackup() {
  const t = T();
  const blob = new Blob([JSON.stringify({ app: 'trip-planner', version: 1, trip: t }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${t.name.replace(/[\\/:*?"<>|]/g, '_')}_${t.start}_백업.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('백업 파일을 저장했습니다.');
}
function importFile(file) {
  const r = new FileReader();
  r.onload = () => { try { const j = JSON.parse(r.result); openImport(j.trip || j, '백업 파일'); } catch (e) { toast('백업 파일을 읽지 못했습니다. 이 플래너에서 저장한 파일인지 확인해 주세요.'); } };
  r.readAsText(file);
}
function openImport(raw, via) {
  let t; try { t = normTrip(raw); } catch (e) { return toast('일정 자료를 읽지 못했습니다.'); }
  const ex = S.trips[t.id];
  /* 이 기기에 같은 여행이 없거나, 있어도 한 번도 고치지 않은 예시 상태면 잃을 것이 없으므로 묻지 않고 바로 가져온다 */
  if (!ex || !ex.updatedAt) {
    S.trips[t.id] = t; closeModal(); switchTrip(t.id);
    toast(`${via}로 받은 ${t.name} 일정을 열었습니다.`);
    return;
  }
  const stat = x => `장소 ${x.places.length}곳, 일정 ${x.schedule.length}개${x.updatedAt ? `, ${fmtStamp(x.updatedAt)} 수정` : ''}`;
  openModal(`${mHead(`${via}로 받은 일정`)}<div class="mbody"><p><b>${esc(t.name)}</b> · ${tripRange(t)}</p><p class="small muted">받은 일정: ${stat(t)}</p>
    ${ex ? `<p class="note">이 기기에도 같은 여행이 있습니다. 이 기기 일정: ${stat(ex)}. 바꾸면 이 기기 일정은 받은 일정으로 덮어써집니다.</p>` : ''}</div>
    <div class="mf"><button class="btn ghost" data-close>취소</button><span class="sp"></span>
    ${ex ? `<button class="btn" id="im-new">새 여행으로 추가</button><button class="btn primary" id="im-rep">받은 일정으로 바꾸기</button>` : `<button class="btn primary" id="im-new">가져오기</button>`}</div>`, c => {
    $('#im-new', c).onclick = () => { if (ex) { t.id = uid(); t.name = (t.name + ' (받은 일정)').slice(0, 60); } S.trips[t.id] = t; closeModal(); switchTrip(t.id); toast('일정을 가져왔습니다.'); };
    if (ex) $('#im-rep', c).onclick = () => { const snap = JSON.stringify(ex); S.trips[t.id] = t; closeModal(); switchTrip(t.id); toast('받은 일정으로 바꿨습니다.', { label: '되돌리기', fn: () => restore(snap) }); };
  });
}
function checkHashImport() {
  const m = location.hash.match(/^#share=(.+)$/); if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  try {
    const json = LZString.decompressFromEncodedURIComponent(m[1]);
    if (!json) throw new Error('empty');
    openImport(JSON.parse(json), '공유 링크');
  } catch (e) { toast('공유 링크를 읽지 못했습니다. 링크가 중간에 잘리지 않았는지 확인해 주세요.'); }
}
function switchTrip(id) {
  if (!S.trips[id]) return;
  S.activeId = id; UI.sheet = null; UI.mapDay = null; UI.planDay = null; UI.ttInit = false; UI.filter = 'all';
  save(); $('#sheet').hidden = true; $('#view-map').classList.remove('has-sheet');
  if (map) { routeLayer.clearLayers(); map.setView(T().center, T().zoom); }

}

    <div class="row2"><label class="fld"><span>여행지 시간대</span><select id="nt-tz">${tzOptions(9)}</select></label><label class="fld"><span>출발지(집) 시간대</span><select id="nt-home">${tzOptions(T().homeTz)}</select></label></div>
    <p class="small muted">지도 기본 위치는 지금 보고 있는 지도 화면으로 정합니다. 만든 뒤 검색으로 여행지를 찾고 더보기 탭에서 기본 위치를 다시 정할 수 있습니다.</p>

      S.trips[t.id] = t; closeModal(); switchTrip(t.id); toast(`${t.name}을(를) 만들었습니다.`);
    };
  });
}
function applyTheme() {
  const th = S.ui.theme || 'auto';
  if (th === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = th;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || '#ffffff';
  setTiles();
}

/* ===== 화면 전환·그리기 ===== */
const TABS = [['map', '지도', 'map'], ['places', '장소', 'pin'], ['plan', '일정', 'cal'], ['flight', '항공', 'plane'], ['more', '더보기', 'list']];
function setTab(tab) {
  if (isWide() && tab === 'map') tab = 'places';
  UI.tab = tab;
  $$('#tabbar [data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  $('#view-map').hidden = !isWide() && tab !== 'map';
  for (const v of ['places', 'plan', 'flight', 'more']) $('#view-' + v).hidden = tab !== v;
  if (tab === 'flight') renderFlights();
  if (tab === 'plan') { renderPlan(); if (!UI.ttInit) { UI.ttInit = true; scrollToFirst(); } }
  if (map) setTimeout(() => map.invalidateSize(), 0);
  save();
}
function renderTop() {
  const t = T(), n = tripDays().length;
  document.title = `${t.name} 플래너`;
  $('#tripName').textContent = t.name;
  const sameYear = t.start.slice(0, 4) === t.end.slice(0, 4), sameMonth = t.start.slice(0, 7) === t.end.slice(0, 7);
  const end = t.start === t.end ? '' : ` – ${sameMonth ? `${+t.end.slice(8)}일(${WD[weekday(t.end)]})` : fmtLongDate(t.end, sameYear)}`;
  $('#tripMeta').textContent = `${fmtLongDate(t.start)}${end} · ${n > 1 ? `${n - 1}박 ${n}일` : '당일'}`;
  tick();
}
function tick() {
  const t = T(), diff = dayNum(t.start) - dayNum(localToday()), n = tripDays().length;
  $('#dday').textContent = diff > 0 ? `D-${diff}` : -diff < n ? `${1 - diff}일차` : '여행 끝';
  $('#clock').textContent = `현지 ${fmtHM(tripNow().min)}`;
}
function renderAll() {
  if (DND.active) { DND.dirty = true; return; }
  renderTop(); renderMapDays(); renderMarkers(); renderPlaces(); renderPlan(); renderMore();
  if (UI.sheet) refreshSheet(false);
}

/* ===== 이벤트 연결 ===== */
function bindEvents() {
  $('#tabbar').innerHTML = TABS.map(([k, l, ic]) => `<button data-tab="${k}" role="tab" aria-selected="false">${icon(ic)}<span>${l}</span></button>`).join('');
  $('#tabbar').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
  $('#btnAddPlace').innerHTML = `${icon('plus')}추가`;
  $('#btnZoomIn').innerHTML = icon('plus'); $('#btnZoomOut').innerHTML = icon('minus');
  $('#btnLocate').innerHTML = icon('locate'); $('#btnFit').innerHTML = icon('fit');
  $('#btnZoomIn').onclick = () => map && map.zoomIn();
  $('#btnZoomOut').onclick = () => map && map.zoomOut();
  $('#btnLocate').onclick = () => toggleLocate();
  $('#btnFit').onclick = fitAll;

  $('#searchForm').addEventListener('submit', e => { e.preventDefault(); $('#searchInput').blur(); doSearch($('#searchInput').value); });
  $('#searchInput').addEventListener('input', e => { if (!e.target.value.trim()) $('#searchResults').hidden = true; });
  $('#searchResults').addEventListener('click', e => {
    const lp = e.target.closest('[data-lp]'); if (lp) return focusPlace(lp.dataset.lp);
    const sr = e.target.closest('[data-sr]'); if (!sr) return;
    const x = searchRes[+sr.dataset.sr]; if (!x) return;
    $('#searchResults').hidden = true;
    if (map) map.setView([+x.lat, +x.lon], Math.max(map.getZoom(), 16));
    openPlaceForm(fromOSM(x));
  });
  $('#mapDays').addEventListener('click', e => { const b = e.target.closest('[data-mapday]'); if (b) setMapDay(b.dataset.mapday); });
  $('#pickBar').addEventListener('click', e => { const a = e.target.closest('[data-action]'); if (!a) return; if (a.dataset.action === 'pick-ok') pickOk(); else endPick(); });

  /* 여러 화면에 공통인 버튼 */
  const common = e => {
    const a = e.target.closest('[data-action]'); if (!a) return false;
    const pid = a.dataset.pid, act = a.dataset.action;
    if (act === 'close-sheet') closeSheet();
    else if (act === 'sched') quickSched(pid);
    else if (act === 'edit') { const p = placeById(pid); if (p) openPlaceForm(p, pid); }
    else if (act === 'focus') focusPlace(pid);
    else if (act === 'route-me') routeFromMe(pid);
    else if (act === 'info') openSheet('place', pid);
    else if (act === 'swap') openSheet('route', UI.sheet.b, UI.sheet.a);
    else if (act === 'edit-sched') { const s = T().schedule.find(x => x.id === a.dataset.sid); if (s) openScheduleModal(s); }
    else if (act === 'add-place') openAddMenu();
    else return false;
    return true;
  };
  $('#sheet').addEventListener('click', common);
  $('#view-places').addEventListener('click', e => { if (common(e)) return; const f = e.target.closest('[data-filter]'); if (f) { UI.filter = f.dataset.filter; renderPlaces(); } });

  $('#planDays').addEventListener('click', e => {
    const b = e.target.closest('[data-day],[data-action="plan-all"]'); if (!b) return;
    if (b.dataset.day) { UI.planDay = b.dataset.day; UI.planAll = false; } else UI.planAll = !UI.planAll;
    renderPlan(); scrollToFirst();
  });
  $('#tt').addEventListener('click', e => {
    if (recentlyDragged()) return;
    const c = e.target.closest('.conn');
    if (c) { if (!isWide()) setTab('map'); setTimeout(() => openSheet('route', c.dataset.from, c.dataset.to), 30); return; }
    const fb = e.target.closest('.blk.flight');
    if (fb) { setTab('flight'); setTimeout(() => { const el = $('#fc-' + fb.dataset.fid); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); return; }
    const b = e.target.closest('.blk[data-sid]');
    if (b) { const s = T().schedule.find(x => x.id === b.dataset.sid); if (s) openScheduleModal(s); }
  });
  $('#tt').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.blk[data-sid]')) { e.preventDefault(); e.target.click(); } });
  $('#tray').addEventListener('click', e => {
    if (recentlyDragged()) return;
    if (e.target.closest('[data-action="tray-toggle"]')) { UI.trayOpen = !UI.trayOpen; renderTray(); save(); return; }
    const c = e.target.closest('.chip-p'); if (c) quickSched(c.dataset.pid, UI.planAll ? null : UI.planDay);
  });
  $('#tray').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.chip-p')) { e.preventDefault(); e.target.click(); } });

  $('#flightBody').addEventListener('input', onFlightInput);
  $('#flightBody').addEventListener('change', onFlightInput);
  $('#flightBody').addEventListener('click', e => {
    const a = e.target.closest('[data-action]'); if (!a) return;
    const t = T();
    if (a.dataset.action === 'add-flight') {
      const last = t.flights[t.flights.length - 1];
      t.flights.push(normFlight({ id: uid(), label: '항공편', from: { code: last ? last.to.code : '', name: last ? last.to.name : '', tz: last ? last.to.tz : t.homeTz }, to: { tz: t.tz } }));
      commit(); renderFlights();
    } else if (a.dataset.action === 'del-flight') {
      const f = t.flights.find(x => x.id === a.dataset.fid); if (!f) return;
      confirmBox('항공편 삭제', `${esc(f.label || '항공편')} 정보를 지웁니다.`, '삭제', () => { const snap = snapshot(); t.flights = t.flights.filter(x => x.id !== f.id); commit(); renderFlights(); toast('항공편을 지웠습니다.', { label: '되돌리기', fn: () => restore(snap) }); });
    }
  });

  const more = $('#moreBody');
  more.addEventListener('change', e => {
    const el = e.target, t = T();
    if (el.dataset.cl) setCheck(el.dataset.cl, c => { c.done = el.checked; });
    else if (el.dataset.clt) setCheck(el.dataset.clt, c => { c.text = el.value.trim().slice(0, 100) || c.text; });
    else if (el.id === 'ts-name') { t.name = el.value.trim().slice(0, 60) || t.name; commit(); }
    else if (el.id === 'ts-start' || el.id === 'ts-end') {
      const s = $('#ts-start').value, en = $('#ts-end').value;
      if (!isDate(s) || !isDate(en) || dayNum(en) < dayNum(s) || dayNum(en) - dayNum(s) > 59) { toast('종료일은 시작일과 같거나 그 뒤여야 하고, 기간은 60일 이내여야 합니다.'); renderMore(); return; }
      t.start = s; t.end = en; UI.planDay = null; commit();
    }
    else if (el.id === 'ts-tz') { t.tz = +el.value; commit(); }
    else if (el.id === 'ts-home') { t.homeTz = +el.value; commit(); }
    else if (el.id === 'importFile' && el.files[0]) { importFile(el.files[0]); el.value = ''; }
  });
  more.addEventListener('submit', e => {
    if (e.target.id !== 'clAdd') return; e.preventDefault();
    const v = $('#clNew').value.trim(); if (!v) return;
    T().checklist.push({ id: uid(), text: v.slice(0, 100), done: false }); commit();
    setTimeout(() => $('#clNew') && $('#clNew').focus(), 0);
  });
  more.addEventListener('click', e => {
    const del = e.target.closest('[data-cldel]');
    if (del) { const snap = snapshot(); T().checklist = T().checklist.filter(c => c.id !== del.dataset.cldel); commit(); toast('준비물을 지웠습니다.', { label: '되돌리기', fn: () => restore(snap) }); return; }
    const th = e.target.closest('[data-theme-set]');
    if (th) { S.ui.theme = th.dataset.themeSet; save(); applyTheme(); renderMore(); return; }
    const a = e.target.closest('[data-action]'); if (!a) return;
    const act = a.dataset.action;
    if (act === 'share') makeShare();
    else if (act === 'export') exportBackup();
    else if (act === 'new-trip') openNewTrip();
    else if (act === 'open-trip') switchTrip(a.dataset.tid);
    else if (act === 'set-center') { if (!map) return; const c = map.getCenter(); T().center = [+c.lat.toFixed(5), +c.lng.toFixed(5)]; T().zoom = map.getZoom(); commit(); toast('지금 지도 화면을 기본 위치로 정했습니다.'); }
    else if (act === 'del-trip') {
      const x = S.trips[a.dataset.tid]; if (!x) return;
      confirmBox('여행 삭제', `${esc(x.name)}의 장소, 시간표, 항공권, 준비물을 이 기기에서 모두 지웁니다. 되돌릴 수 없으니 필요하면 먼저 백업 파일을 저장해 주세요.`, '삭제', () => { delete S.trips[x.id]; save(); renderMore(); toast(`${x.name}을(를) 지웠습니다.`); });
    }
    else if (act === 'del-samples') {
      const ids = T().places.filter(p => p.sample).map(p => p.id), n = T().schedule.filter(s => ids.includes(s.placeId)).length;
      confirmBox('예시 장소 지우기', `예시 장소 ${ids.length}곳을 지웁니다.${n ? ` 이 장소들로 만든 일정 ${n}개도 함께 지워집니다.` : ''} 직접 추가하거나 고친 장소는 남습니다.`, '지우기', () => {
        const snap = snapshot(), t = T(); t.places = t.places.filter(p => !p.sample); t.schedule = t.schedule.filter(s => !ids.includes(s.placeId)); closeSheet(); commit();
        toast('예시 장소를 지웠습니다.', { label: '되돌리기', fn: () => restore(snap) });
      });
    }
  });

  $('#modal').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if (UI.pick) endPick(); else if (UI.sheet) closeSheet(); } });
  matchMedia('(min-width: 960px)').addEventListener('change', () => setTab(UI.tab === 'places' && !isWide() ? 'map' : UI.tab));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme());
  window.addEventListener('resize', () => map && map.invalidateSize());
  window.addEventListener('hashchange', checkHashImport);
}

/* 홈 화면 아이콘: 실행할 때 그려서 붙인다 */
function makeIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const g = c.getContext('2d');
    g.fillStyle = '#0d7457'; g.fillRect(0, 0, 180, 180);
    g.fillStyle = '#ffffff'; g.beginPath(); g.arc(90, 74, 42, Math.PI, 0); g.lineTo(90, 148); g.closePath(); g.fill();
    g.beginPath(); g.arc(90, 74, 42, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#0d7457'; g.beginPath(); g.arc(90, 74, 17, 0, Math.PI * 2); g.fill();
    const url = c.toDataURL('image/png');
    for (const rel of ['apple-touch-icon', 'icon']) { const l = document.createElement('link'); l.rel = rel; l.href = url; document.head.appendChild(l); }
  } catch (e) { /* 아이콘 없이 진행 */ }
}

/* ===== 시작 ===== */
applyTheme();
initMap();
bindEvents();
renderAll();
setTab(UI.tab);
renderFlights();
makeIcon();
setInterval(() => { tick(); if (UI.tab === 'plan' && !DND.active && tripDays().includes(tripNow().date)) renderPlan(); }, 30000);
checkHashImport();
</script>
</body>
</html>
